<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f4f2">
<meta name="description" content="BOX8 — About, Project, Shop, VHS, The Screen, Studio Box8, What's Your Genre, Cinema Mapping.">
<title>BOX8</title>
<style>
:root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;background:#f4f4f2;color:#171717}*{box-sizing:border-box}body{margin:0}button,a{-webkit-tap-highlight-color:transparent}header{height:88px;padding:0 36px;display:flex;align-items:center;justify-content:space-between}a{color:inherit;text-decoration:none}.wordmark{font-size:31px;font-weight:900;letter-spacing:-2px;line-height:1}.wordmark span{display:inline-flex;background:#171717;color:#f4f4f2;align-items:center;justify-content:center;width:29px;height:29px;margin-left:3px;font-size:27px;letter-spacing:-1px}.shuffle{border:0;background:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:12px 0;font-size:11px;text-transform:uppercase;letter-spacing:1.3px}.shuffle svg{width:18px;height:18px}.stage{position:relative;height:calc(100svh - 126px);min-height:370px;margin:0 20px}.tile{position:absolute;border:0;border-radius:0;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;color:#171717;padding:14px;font-family:inherit;font-size:clamp(15px,1.75vw,31px);font-weight:400;letter-spacing:-.05em;line-height:1.02;transition:left .65s cubic-bezier(.22,1,.36,1),top .65s cubic-bezier(.22,1,.36,1),transform .22s;overflow-wrap:normal}.tile:hover{transform:translateY(-5px);z-index:1}.tile:focus-visible,.shuffle:focus-visible,.wordmark:focus-visible{outline:2px solid #171717;outline-offset:5px}.tile[data-id="vhs"]{color:#fff}.tile small{position:absolute;left:12px;top:10px;font-size:9px;letter-spacing:0;opacity:.5}footer{height:38px;padding:0 36px;display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:1.1px;text-transform:uppercase;color:#686864}dialog{border:0;padding:0;width:min(650px,calc(100vw - 40px));color:#171717;background:#f4f4f2}dialog::backdrop{background:#17171760;backdrop-filter:blur(5px)}.detail{padding:36px;min-height:310px;position:relative}.detail h1{font-size:clamp(40px,8vw,74px);font-weight:400;letter-spacing:-.06em;line-height:.98;margin:45px 0 30px}.detail p{font-size:14px;line-height:1.7}.close{position:absolute;right:20px;top:15px;border:0;background:none;font-size:26px;cursor:pointer;padding:5px 10px}.eyebrow{font-size:10px;letter-spacing:2px}@media(max-width:600px){header{height:72px;padding:0 20px}.wordmark{font-size:27px}.stage{height:calc(100svh - 110px);margin:0 12px;min-height:500px}.tile{font-size:clamp(15px,4.5vw,24px);padding:9px}footer{padding:0 20px;font-size:8px}.shuffle{font-size:9px}.tile small{font-size:8px;left:8px;top:7px}}@media(prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<header><a class="wordmark" href="./" aria-label="BOX8 home">BOX<span>8</span></a><button class="shuffle" id="shuffle" aria-label="메뉴 위치 다시 섞기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 6h3c5 0 7 12 12 12h3M17 14l4 4-4 4M3 18h3c2 0 4-3 6-6s4-6 6-6h3M17 2l4 4-4 4"/></svg>Shuffle</button></header>
<main class="stage" id="stage" aria-label="BOX8 메뉴"></main>
<footer><span>Eight boxes. Infinite possibilities.</span><span>© BOX8</span></footer>
<dialog id="dialog" aria-labelledby="detail-title"><div class="detail" id="detail"><button class="close" aria-label="닫기">×</button><span class="eyebrow">BOX8 / <span id="detail-number"></span></span><h1 id="detail-title"></h1><p>이 메뉴의 콘텐츠는 준비 중입니다.</p><p class="eyebrow">SAMPLE PAGE</p></div></dialog>
<script>
const menus=[{id:'about',label:'about',color:'#e399b6'},{id:'project',label:'project',color:'#c9c9c9'},{id:'shop',label:'shop',color:'#ffb20b'},{id:'vhs',label:'VHS',color:'#1300fa'},{id:'the-screen',label:'THE SCREEN',color:'#c94cf3'},{id:'studio-box8',label:'STUDIO BOX8',color:'#bf302c'},{id:'whats-your-genre',label:"what’s your genre",color:'#85cada'},{id:'cinema-mapping',label:'cinema mapping',color:'#f45529'}];
const stage=document.querySelector('#stage'),dialog=document.querySelector('#dialog');
menus.forEach((menu,index)=>{const button=document.createElement('button');button.className='tile';button.dataset.id=menu.id;button.style.background=menu.color;const number=document.createElement('small');number.textContent=String(index+1).padStart(2,'0');const label=document.createElement('span');label.textContent=menu.label;button.append(number,label);button.addEventListener('click',()=>{location.hash=menu.id});stage.append(button)});
function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]]}return array}
function layout(){const width=stage.clientWidth,height=stage.clientHeight;const columns=width<600?3:width<1000?6:10;const size=Math.floor(Math.min(width/columns,height/(width<600?5:4)));const cols=Math.floor(width/size),rows=Math.floor(height/size);const cells=shuffle(Array.from({length:cols*rows},(_,i)=>i)).slice(0,8);const ox=(width-cols*size)/2,oy=(height-rows*size)/2;[...stage.children].forEach((tile,i)=>{tile.style.width=tile.style.height=size+'px';tile.style.left=ox+(cells[i]%cols)*size+'px';tile.style.top=oy+Math.floor(cells[i]/cols)*size+'px'})}
function route(){const index=menus.findIndex(m=>m.id===location.hash.slice(1));if(index<0){if(dialog.open)dialog.close();return}const menu=menus[index];document.querySelector('#detail').style.background=menu.color;document.querySelector('#detail').style.color=menu.id==='vhs'?'#fff':'#171717';document.querySelector('#detail-title').textContent=menu.label;document.querySelector('#detail-number').textContent=String(index+1).padStart(2,'0');if(!dialog.open)dialog.showModal()}
function closeDetail(){history.replaceState(null,'',location.pathname+location.search);dialog.close()}
document.querySelector('.close').addEventListener('click',closeDetail);dialog.addEventListener('click',e=>{if(e.target===dialog)closeDetail()});dialog.addEventListener('cancel',e=>{e.preventDefault();closeDetail()});window.addEventListener('hashchange',route);document.querySelector('#shuffle').addEventListener('click',layout);let timer;window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(layout,120)});layout();route();
</script>
</body>
</html>
