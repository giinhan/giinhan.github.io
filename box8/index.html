<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f4f2">
<meta name="description" content="BOX8 — About, Project, Shop, VHS, The Screen, Studio Box8, What's Your Genre, Cinema Mapping.">
<title>BOX8</title>
<style>
:root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;background:#f4f4f2;color:#171717}*{box-sizing:border-box}body{margin:0}button,a{-webkit-tap-highlight-color:transparent}header{height:88px;padding:0 36px;display:flex;align-items:center;justify-content:space-between}a{color:inherit;text-decoration:none}.wordmark{display:inline-flex;align-items:center;line-height:0}.wordmark img{display:block;width:150px;height:auto;mix-blend-mode:multiply}.stage{position:relative;height:calc(100svh - 126px);min-height:180px;margin:0 20px}.tile{position:absolute;border:0;border-radius:0;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;color:#171717;padding:14px;font-family:inherit;font-size:clamp(15px,calc(var(--tile-size, 180px) * .15),90px);font-weight:400;letter-spacing:-.05em;line-height:1.02;transition:left .65s cubic-bezier(.22,1,.36,1),top .65s cubic-bezier(.22,1,.36,1),transform .22s;overflow-wrap:normal}.tile:hover{transform:translateY(-5px);z-index:1}.tile:focus-visible,.wordmark:focus-visible{outline:2px solid #171717;outline-offset:5px}.tile[data-id="vhs"]{color:#fff}.tile small{position:absolute;left:12px;top:10px;font-size:9px;letter-spacing:0;opacity:.5}footer{height:38px;padding:0 36px;display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:1.1px;text-transform:uppercase;color:#686864}@media(max-width:600px){header{height:72px;padding:0 20px}.wordmark img{width:125px}.stage{height:calc(100svh - 110px);margin:0 12px;min-height:500px}.tile{padding:9px}footer{padding:0 20px;font-size:8px}.tile small{font-size:8px;left:8px;top:7px}}@media(prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<header><a class="wordmark" href="./" aria-label="BOX8 home"><img src="./img/logo_box8.png" width="672" height="232" alt="BOX8"></a></header>
<main class="stage" id="stage" aria-label="BOX8 메뉴"></main>
<footer><span>Eight boxes. Infinite possibilities.</span><span>© BOX8</span></footer>
<script>
const menus=[{id:'about',label:'about',color:'#e399b6'},{id:'project',label:'project',color:'#c9c9c9'},{id:'shop',label:'shop',color:'#ffb20b'},{id:'vhs',label:'VHS',color:'#1300fa'},{id:'the-screen',label:'THE SCREEN',color:'#c94cf3'},{id:'studio-box8',label:'STUDIO BOX8',color:'#bf302c'},{id:'whats-your-genre',label:"what’s your genre",color:'#85cada'},{id:'cinema-mapping',label:'cinema mapping',color:'#f45529'}];
const stage=document.querySelector('#stage');
menus.forEach((menu,index)=>{const button=document.createElement('a');button.className='tile';button.dataset.id=menu.id;button.style.background=menu.color;const number=document.createElement('small');number.textContent=String(index+1).padStart(2,'0');const label=document.createElement('span');label.textContent=menu.label;button.append(number,label);button.href='./'+menu.id+'/';stage.append(button)});

let layoutSeed=Math.random();
function gridFor(width,height){let best={size:0,cols:0,rows:0};for(let cols=1;cols<=18;cols++){const rows=Math.ceil(18/cols),size=Math.min(width/cols,height/rows);if(size>best.size)best={size,cols,rows}}return best}
function layout(randomize=false){if(randomize)layoutSeed=Math.random();const width=stage.clientWidth,height=stage.clientHeight;if(!width||!height)return;const {size,cols,rows}=gridFor(width,height);let seed=Math.floor(layoutSeed*4294967296)>>>0;function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}const cells=Array.from({length:cols*rows},(_,i)=>i);for(let i=cells.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}const ox=(width-cols*size)/2,oy=(height-rows*size)/2;stage.style.setProperty('--tile-size',size+'px');[...stage.children].forEach((tile,i)=>{tile.style.width=tile.style.height=size+'px';tile.style.left=ox+(cells[i]%cols)*size+'px';tile.style.top=oy+Math.floor(cells[i]/cols)*size+'px'})}
window.addEventListener('pageshow',event=>{if(event.persisted)layout(true)});let timer;window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(layout,120)});layout();
</script>
</body>
</html>
